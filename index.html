<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);

/* ---------- 오늘의 바람 (날짜 시드) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const now = new Date();
const MON = now.getMonth()+1, DAY = now.getDate();
const dayKey = `${now.getFullYear()}${String(MON).padStart(2,'0')}${String(DAY).padStart(2,'0')}`;
const drng = mulberry32(parseInt(dayKey,10));
const WP = {f:0.35+drng()*0.5, ph:drng()*6.28, f2:0.9+drng()*0.8, ph2:drng()*6.28, bias:(drng()-0.5)*0.6, k:0.75+drng()*0.5};
function windFor(level){
  if(level<3) return 0;
  const amp = Math.min(1.9, 0.3+(level-3)*0.09)*WP.k;
  return amp*(0.75*Math.sin(level*WP.f+WP.ph)+0.25*Math.sin(level*WP.f2+WP.ph2)+WP.bias);
}

/* ---------- 저장 ---------- */
function load(k){try{return parseInt(localStorage.getItem(k)||'0',10)||0}catch(e){return 0}}
function save(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
const KEY_BEST='snowman_best', KEY_DAY='snowman_day_'+dayKey;

/* ---------- 소리 ---------- */
let ac=null, sfxOn=true, musicOn=true, master=null, sfxBus=null, musicBus=null, windGain=null, lastWG=-1;
try{ sfxOn=localStorage.getItem('snowman_sfx')!=='0'; musicOn=localStorage.getItem('snowman_music')!=='0'; }catch(e){}
function initAudio(){
  if(ac){ if(ac.state!=='running') ac.resume().catch(()=>{}); return; }
  try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; return; }
  master=ac.createGain(); master.gain.value=0.9; master.connect(ac.destination);
  sfxBus=ac.createGain(); sfxBus.gain.value=sfxOn?1:0; sfxBus.connect(master);
  musicBus=ac.createGain(); musicBus.gain.value=musicOn?0.55:0; musicBus.connect(master);
  try{ const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0); }catch(e){}
  // 바람 소리: 계속 흐르고 바람 세기에 따라 커짐
  try{
    const len=ac.sampleRate*2, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    let last=0; for(let i=0;i<len;i++){ last=(last+0.02*(Math.random()*2-1))/1.02; d[i]=last*3.5; }
    const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=700;
    windGain=ac.createGain(); windGain.gain.value=0;
    src.connect(f); f.connect(windGain); windGain.connect(sfxBus); src.start();
  }catch(e){}
  if(ac.state!=='running') ac.resume().catch(()=>{});
  startMusic();
}
['touchend','click','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,initAudio,{passive:true}));
document.addEventListener('visibilitychange',()=>{ if(!ac) return; if(document.hidden) ac.suspend().catch(()=>{}); else ac.resume().catch(()=>{}); });

function tone(freq,dur,type,vol,slide,when,bus){
  if(!ac) return;
  try{
    const t0=ac.currentTime+(when||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(bus||sfxBus); o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
let noiseBuf=null;
function getNoise(){
  if(!noiseBuf){ const len=ac.sampleRate; noiseBuf=ac.createBuffer(1,len,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
  return noiseBuf;
}
function noise(dur,vol,freq,when,opt){
  if(!ac) return; opt=opt||{};
  try{
    const t0=opt.at!=null?opt.at:ac.currentTime+(when||0);
    const s=ac.createBufferSource(); s.buffer=getNoise(); s.loop=true;
    const f=ac.createBiquadFilter(); f.type=opt.type||'lowpass'; f.frequency.setValueAtTime(freq||900,t0); if(opt.q) f.Q.value=opt.q;
    if(opt.to) f.frequency.exponentialRampToValueAtTime(opt.to,t0+dur);
    const g=ac.createGain(); g.gain.setValueAtTime(vol||0.2,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(opt.bus||sfxBus); s.start(t0,Math.random()*0.5); s.stop(t0+dur+0.03);
  }catch(e){}
}
let growOsc=null;
function growStart(){
  if(!ac||growOsc) return;
  try{
    const t=ac.currentTime, o=ac.createOscillator(), o2=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter(), lfo=ac.createOscillator(), lg=ac.createGain();
    o.type='triangle'; o2.type='sine'; o.frequency.value=260; o2.frequency.value=520;
    f.type='lowpass'; f.frequency.value=1600;
    lfo.frequency.value=8; lg.gain.value=0.035; lfo.connect(lg); lg.connect(g.gain);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.08,t+0.06);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(sfxBus); o.start(t); o2.start(t); lfo.start(t);
    growOsc={o,o2,g,lfo};
  }catch(e){ growOsc=null; }
}
function growUpdate(r){
  if(!growOsc) return;
  const fr=260+((r-0.35)/1.0)*380, t=ac.currentTime;
  growOsc.o.frequency.setTargetAtTime(fr,t,0.03); growOsc.o2.frequency.setTargetAtTime(fr*2,t,0.03);
}
function growStop(){
  if(!growOsc) return;
  try{ const {o,o2,g,lfo}=growOsc, t=ac.currentTime; g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0.0001,t,0.025); [o,o2,lfo].forEach(x=>x.stop(t+0.2)); }catch(e){}
  growOsc=null;
}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const sfx = {
  click(){ tone(660,0.09,'sine',0.15,1.5); },
  grow(r){ const p=(r-0.35)/1.0; noise(0.07,0.06+p*0.06,2600-p*1400,0,{type:'bandpass',q:1.3}); },
  full(){ tone(1046.5,0.12,'triangle',0.12); tone(1568,0.2,'triangle',0.1,0,0.07); },
  whoosh(){ noise(0.35,0.14,2600,0,{type:'bandpass',q:0.8,to:350}); },
  land(r){ const k=Math.min(1,r/1.35); noise(0.2,0.25+k*0.3,450+450*(1-k)); tone(180-k*80,0.25,'sine',0.32,0.45); },
  perfect(n){ const b=660*Math.pow(1.0595,Math.min(n,6)*2);
    tone(b,0.16,'triangle',0.16); tone(b*1.26,0.18,'triangle',0.13,0,0.06); tone(b*1.5,0.32,'triangle',0.12,0,0.12); tone(b*3,0.28,'sine',0.05,0,0.12); },
  creak(){ tone(90,0.5,'sawtooth',0.05,1.5); tone(135,0.4,'sawtooth',0.035,0.75,0.14); },
  crash(){ noise(0.9,0.5,700,0,{to:140}); tone(110,0.6,'sine',0.35,0.35); noise(0.5,0.3,1200,0.25); noise(0.4,0.25,900,0.5); },
  miss(){ tone(540,0.42,'sine',0.18,0.4); noise(0.3,0.25,600,0.35); },
  over(){ [523.25,440,392,329.63].forEach((f,i)=>tone(f,0.3,'triangle',0.13,0,i*0.16)); },
  record(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i===3?0.7:0.22,'triangle',0.15,0,i*0.11)); tone(1568,0.6,'sine',0.05,0,0.33); }
};

/* ---------- 배경음: 징글벨 (J. Pierpont, 1857 · 퍼블릭 도메인) ---------- */
const BPM=148, BEAT=60/BPM, LOOP=64;
const N={G2:98,A2:110,C3:130.81,D3:146.83,E3:164.81,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33};
const PART_A=[['B4',1],['B4',1],['B4',2],['B4',1],['B4',1],['B4',2],['B4',1],['D5',1],['G4',1.5],['A4',0.5],['B4',4]];
const PART_B=[['C5',1],['C5',1],['C5',1.5],['C5',0.5],['C5',1],['B4',1],['B4',1],['B4',0.5],['B4',0.5]];
const MEL=[...PART_A,...PART_B,['B4',1],['A4',1],['A4',1],['B4',1],['A4',2],['D5',2],
           ...PART_A,...PART_B,['D5',1],['D5',1],['C5',1],['A4',1],['G4',4]];
const CHORDS=['G','G','G','G','C','G','A','D','G','G','G','G','C','G','D','G'];
const BASS={G:['G2','D3'],C:['C3','G2'],A:['A2','E3'],D:['D3','A2']};
const events=[];
(function(){
  let t=0; MEL.forEach(([n,d])=>{ events.push({t,k:'m',f:N[n],d}); t+=d; });
  CHORDS.forEach((c,i)=>{ const [r,f5]=BASS[c]; events.push({t:i*4,k:'b',f:N[r],d:1.8}); events.push({t:i*4+2,k:'b',f:N[f5],d:1.8}); });
  for(let b=0;b<LOOP;b+=0.5) events.push({t:b,k:'s',acc:b%1===0});
  events.sort((a,b)=>a.t-b.t);
})();
let musicStarted=false, loopStart=0, evIdx=0;
function voice(f,at,dur,type,vol){
  const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,at); g.gain.exponentialRampToValueAtTime(vol,at+0.012);
  g.gain.exponentialRampToValueAtTime(vol*0.35,at+Math.min(0.25,dur*0.5)); g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g); g.connect(musicBus); o.start(at); o.stop(at+dur+0.03);
}
function playEv(e,at){
  try{
    if(e.k==='m'){ const dur=e.d*BEAT*0.95; voice(e.f,at,dur,'triangle',0.16); voice(e.f*2,at,Math.min(dur,0.35),'sine',0.05); }
    else if(e.k==='b'){ voice(e.f,at,e.d*BEAT,'sine',0.22); }
    else{ noise(0.07,e.acc?0.06:0.035,7000,0,{type:'highpass',at,bus:musicBus}); if(e.acc) noise(0.05,0.03,9000,0,{type:'highpass',at:at+0.03,bus:musicBus}); }
  }catch(err){}
}
function schedule(){
  if(!ac||ac.state!=='running') return;
  const now=ac.currentTime, horizon=now+0.25;
  for(let guard=0;guard<400;guard++){
    const e=events[evIdx], at=loopStart+e.t*BEAT;
    if(at>horizon) break;
    if(at>=now-0.05) playEv(e,at);
    evIdx++; if(evIdx>=events.length){ evIdx=0; loopStart+=LOOP*BEAT; }
  }
}
function startMusic(){ if(musicStarted||!ac) return; musicStarted=true; loopStart=ac.currentTime+0.2; evIdx=0; setInterval(schedule,40); }

function refreshSoundBtns(){
  $('mute').textContent=sfxOn?'🔊':'🔇';
  $('music').classList.toggle('off',!musicOn);
}
$('mute').addEventListener('click',()=>{ sfxOn=!sfxOn; try{localStorage.setItem('snowman_sfx',sfxOn?'1':'0')}catch(e){}
  if(sfxBus) sfxBus.gain.setTargetAtTime(sfxOn?1:0,ac.currentTime,0.05); refreshSoundBtns(); });
$('music').addEventListener('click',()=>{ musicOn=!musicOn; try{localStorage.setItem('snowman_music',musicOn?'1':'0')}catch(e){}
  if(musicBus) musicBus.gain.setTargetAtTime(musicOn?0.55:0,ac.currentTime,0.1); refreshSoundBtns(); });
refreshSoundBtns();

/* ---------- Three.js 장면 ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const snowGeo=(function(){
  const g=new THREE.SphereGeometry(1,48,32), p=g.attributes.position, v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const n=0.035*(Math.sin(v.x*7.1+v.y*3.3)*Math.sin(v.y*6.7-v.z*4.1)+0.6*Math.sin(v.z*11.3+v.x*5.9)*Math.sin(v.y*9.7+1.3));
    v.multiplyScalar(1+n); p.setXYZ(i,v.x,v.y,v.z);
  }
  g.computeVertexNormals(); return g;
})();
function makeBall(r){

}

function addBall(x,y,r){
  const m=makeBall(r); m.position.set(x,y,0); pivot.add(m);
  const b={mesh:m,x,y,r,m:r*r*r,squish:0}; tower.push(b); return b;
}
const topBall=()=>tower[tower.length-1];

function heightCm(){ const t=topBall(); return Math.round((t.y+t.r)*CM); }

// 균형 계산: 각 단 위에 올라간 눈덩이들의 무게중심이 받침에서 얼마나 벗어났는지
function stability(){
  const n=tower.length; let sm=0,smx=0,worst=0,wk=-1,sign=1,sum=0,cnt=0;
  for(let k=n-1;k>=0;k--){
    const b=tower[k];
    if(k<n-1){
      const com=smx/sm, ratio=(com-b.x)/(b.r*0.75), f=1+0.12*Math.min(4,sm/b.m), sr=ratio*f;
      sum+=sr; cnt++;
      const s=sr+theta*1.6;
      if(Math.abs(s)>worst){ worst=Math.abs(s); wk=k; sign=s>=0?1:-1; }
    }
    sm+=b.m; smx+=b.m*b.x;
  }
  return {danger:worst,k:wk,sign,mean:cnt?sum/cnt:0};
}

function pop(text,color){
  const p=$('pop'); p.textContent=text; p.style.color=color||'#fff';
  p.classList.remove('show'); void p.offsetWidth; p.classList.add('show');
}

function release(){
  if(state!=='hold') return;
  state='drop'; cur.vy=0; growStop(); sfx.whoosh();
  if(firstDrop){ firstDrop=false; $('tip').style.display='none'; }
}

function land(landY){
  const top=topBall(), r=cur.r;
  pivot.updateMatrixWorld(true);
  const local=pivot.worldToLocal(new THREE.Vector3(cur.x,landY,0));
  let d=local.x-top.x;
  if(Math.abs(d)>(top.r+r)*0.62){ miss(d); return; }
  const perfect=Math.abs(d)<Math.max(0.07,top.r*0.1);
  if(perfect){
    d=0; combo++; bestCombo=Math.max(bestCombo,combo);
    pop(combo>1?`PERFECT ×${combo}`:'PERFECT!','#ffd166');
    thetaV*=0.3; theta*=0.6; sfx.perfect(combo); buzz(15);
  }else{
    combo=0;
    thetaV+=Math.sign(d)*(Math.abs(d)/top.r)*0.8*Math.min(1.5,r/top.r);
    buzz(10);
  }
  scene.remove(cur.mesh); cur=null;
  const S=(top.r+r)*0.88, y=top.y+Math.sqrt(Math.max(S*S-d*d,S*S*0.3));
  const b=addBall(top.x+d,y,r); b.squish=1; b.mesh.add(face);
  levels++; windTarget=windFor(levels);
  sfx.land(r); state='settle'; settleT=0; peakDanger=0;
}

function miss(d){
  const dir=d>=0?1:-1;
  fallers.push({mesh:cur.mesh,r:cur.r,vx:dir*3.2,vy:-2,vz:0.6});
  cur=null; combo=0; state='miss'; overT=1.5; overReason='miss';
  pop('앗! 미끄러졌다','#e63946'); sfx.miss(); buzz([20,40,20]);
}

function collapse(k,sign){
  const falling=tower.splice(k+1);
  falling.forEach((b,i)=>{
    scene.attach(b.mesh);
    fallers.push({mesh:b.mesh,r:b.r,vx:sign*(1.4+i*0.35+Math.random()*1.2),vy:0.8+Math.random()*2,vz:(Math.random()-0.5)*2.5});
  });
  growStop();
  if(cur){ fallers.push({mesh:cur.mesh,r:cur.r,vx:sign*0.6,vy:0,vz:0}); cur=null; }
  state='collapse'; overT=2.1; overReason='collapse';
  pop('와르르!','#e63946'); sfx.crash(); buzz([30,40,70]);
}

function drawCard(){
  const W=720,H=960,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  let gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#5d9fd6'); gr.addColorStop(0.7,'#cfe6f7'); gr.addColorStop(1,'#eef6fc');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  const rr=mulberry32(scoreCm*31+7);
  g.fillStyle='rgba(255,255,255,.75)';
  for(let i=0;i<80;i++){ g.beginPath(); g.arc(rr()*W,rr()*H*0.85,1.5+rr()*3.5,0,7); g.fill(); }
  const groundY=H-150;
  g.fillStyle='#f7fbff'; g.beginPath(); g.moveTo(0,groundY+14); g.quadraticCurveTo(W/2,groundY-24,W,groundY+14); g.lineTo(W,H); g.lineTo(0,H); g.closePath(); g.fill();

  const s=snapshot, top=s[s.length-1], totalH=top.y+top.r;
  let minX=Infinity,maxX=-Infinity; s.forEach(b=>{minX=Math.min(minX,b.x-b.r); maxX=Math.max(maxX,b.x+b.r);});
  const areaH=groundY-300, sc=Math.min(areaH/totalH,(W*0.6)/(maxX-minX),140);
  const cx0=W/2-((minX+maxX)/2)*sc;
  const P=b=>({x:cx0+b.x*sc,y:groundY-b.y*sc,r:b.r*sc});
  // 그림자
  const b0=P(s[0]); g.fillStyle='rgba(90,120,150,.18)'; g.beginPath(); g.ellipse(b0.x+8,groundY+4,b0.r*1.1,b0.r*0.22,0,0,7); g.fill();
  // 팔 (머리 바로 아래 눈덩이)
  if(s.length>=2){
    const b=P(s[s.length-2]); g.strokeStyle='#6b4a2f'; g.lineCap='round'; g.lineWidth=Math.max(4,b.r*0.07);
    [-1,1].forEach(side=>{
      const sx=b.x+side*b.r*0.8, sy=b.y-b.r*0.15, ex=b.x+side*b.r*1.65, ey=b.y-b.r*0.75;
      g.beginPath(); g.moveTo(sx,sy); g.lineTo(ex,ey); g.stroke();
      const mx=sx+(ex-sx)*0.65, my=sy+(ey-sy)*0.65;
      g.beginPath(); g.moveTo(mx,my); g.lineTo(mx+side*b.r*0.12,my-b.r*0.28); g.stroke();
    });
  }
  // 몸통
  s.forEach((b,i)=>{
    const p=P(b), rg=g.createRadialGradient(p.x-p.r*0.35,p.y-p.r*0.4,p.r*0.1,p.x,p.y,p.r);
    rg.addColorStop(0,'#ffffff'); rg.addColorStop(0.72,'#eef4fa'); rg.addColorStop(1,'#c9d8e6');
    g.fillStyle=rg; g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill();
    g.strokeStyle='rgba(120,150,180,.35)'; g.lineWidth=2; g.stroke();
    if(i<s.length-1){ g.fillStyle='#2b2b2b'; g.beginPath(); g.arc(p.x,p.y-p.r*0.1,Math.max(3,p.r*0.08),0,7); g.fill(); }
  });
  // 목도리
  const h=P(top);
  if(s.length>=2){
    g.fillStyle='#e63946';
    g.beginPath(); g.ellipse(h.x,h.y+h.r*0.9,h.r*0.9,h.r*0.17,0,0,7); g.fill();
    g.beginPath(); g.moveTo(h.x+h.r*0.35,h.y+h.r*0.92); g.lineTo(h.x+h.r*0.62,h.y+h.r*0.95); g.lineTo(h.x+h.r*0.72,h.y+h.r*1.55); g.lineTo(h.x+h.r*0.42,h.y+h.r*1.55); g.closePath(); g.fill();
  }
  // 얼굴
  g.fillStyle='#222';
  [-1,1].forEach(sd=>{ g.beginPath(); g.arc(h.x+sd*h.r*0.3,h.y-h.r*0.25,h.r*0.09,0,7); g.fill(); });
  for(let i=-2;i<=2;i++){ g.beginPath(); g.arc(h.x+i*h.r*0.14,h.y+h.r*(0.2+0.08*(1-i*i/4)),h.r*0.045,0,7); g.fill(); }
  g.fillStyle='#ff7a1a'; g.beginPath(); g.moveTo(h.x,h.y-h.r*0.1); g.lineTo(h.x+h.r*0.75,h.y+h.r*0.02); g.lineTo(h.x,h.y+h.r*0.08); g.closePath(); g.fill();
  // 높이 자
  const rx=Math.min(W-50,cx0+maxX*sc+50), ty=groundY-totalH*sc;
  g.strokeStyle='rgba(43,93,138,.55)'; g.lineWidth=3; g.setLineDash([8,8]);
  g.beginPath(); g.moveTo(rx,groundY); g.lineTo(rx,ty); g.stroke(); g.setLineDash([]);
  g.beginPath(); g.moveTo(rx-12,ty); g.lineTo(rx+12,ty); g.moveTo(rx-12,groundY); g.lineTo(rx+12,groundY); g.stroke();
  // 글자
  g.textAlign='center';
  g.fillStyle='#eaf4ff'; g.font='38px Jua, sans-serif'; g.fillText('오늘의 눈사람',W/2,78);
  g.shadowColor='rgba(29,53,87,.35)'; g.shadowBlur=14; g.shadowOffsetY=4;
  g.fillStyle='#fff'; g.font='124px Jua, sans-serif'; g.fillText(scoreCm+'cm',W/2,198);
  g.shadowColor='transparent'; g.shadowBlur=0; g.shadowOffsetY=0;
  g.fillStyle='#eaf4ff'; g.font='34px Jua, sans-serif';
  g.fillText(`${s.length}단 · PERFECT 최대 ${bestCombo}연속`,W/2,250);
  g.fillStyle='#5b7a99'; g.font='30px Jua, sans-serif'; g.fillText(`${MON}월 ${DAY}일 · 오늘의 바람에서`,W/2,H-78);
  g.fillStyle='#8aa2bb'; g.font='24px Jua, sans-serif'; g.fillText((typeof SITE==='string'&&SITE?SITE.replace(/^https?:\/\//,'').replace(/\/$/,'')+'  ·  ':'엉뚱한 연구소 · 눈사람 쌓기  ')+'@ungttung.lab',W/2,H-38);
  lastCard=c;
  return c.toDataURL('image/png');
}

function gameOver(){
  state='over';
  const best=load(KEY_BEST), dbest=load(KEY_DAY), isNew=scoreCm>best;
  if(scoreCm>best) save(KEY_BEST,scoreCm);
  if(scoreCm>dbest) save(KEY_DAY,scoreCm);
  $('reason').textContent=overReason==='miss'?'앗, 미끄러졌다!':'와르르!';
  $('finalCm').textContent=scoreCm;
  $('newrec').style.display=isNew&&scoreCm>70?'block':'none';
  $('finalMeta').textContent=`${snapshot.length}단 · PERFECT 최대 ${bestCombo}연속 · 내 최고 ${Math.max(best,scoreCm)}cm`;
  $('copyMsg').textContent='';
  const draw=()=>{ $('cardImg').src=drawCard(); };
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw).catch(draw); else draw();
  if(isNew&&scoreCm>70) sfx.record(); else sfx.over();
  $('shareBtn').style.display=canShareFiles()?'block':'none';
  $('over').classList.add('show'); updateHUD();
}

const IN_CLAUDE=!!(window.claude&&window.claude.use);
const SITE=IN_CLAUDE?'':(location.origin&&location.origin.startsWith('http')?location.origin+location.pathname.replace(/index\.html$/,''):'');
function brag(){ return `⛄ 오늘의 눈사람 ${scoreCm}cm (${snapshot.length}단) 쌓았다! 같은 바람에서 내 기록 깰 수 있어?${SITE?'\n'+SITE:''}\n#눈사람쌓기 @ungttung.lab`; }
function cardBlob(){ return new Promise(res=>lastCard.toBlob(res,'image/png')); }
function cardName(){ return `눈사람_${scoreCm}cm_${dayKey}.png`; }
function canShareFiles(){
  try{ return !IN_CLAUDE&&!!navigator.canShare&&navigator.canShare({files:[new File(['x'],'a.png',{type:'image/png'})]}); }catch(e){ return false; }
}
function copyText(txt,okMsg){
  const m=$('copyMsg');
  try{ navigator.clipboard.writeText(txt).then(()=>{m.textContent=okMsg;}).catch(()=>{m.textContent=txt;}); }catch(e){ m.textContent=txt; }
}
$('copyBtn').addEventListener('click',()=>{ sfx.click(); copyText(brag(),'복사됐어요! 스토리나 DM에 붙여넣어 보세요'); });
// 📸 자랑하기: 휴대폰 공유창(인스타그램·카카오톡 등)으로 이미지+문구 보내기
$('shareBtn').addEventListener('click',async()=>{
  sfx.click(); if(!lastCard) return;
  const m=$('copyMsg');
  try{
    const file=new File([await cardBlob()],cardName(),{type:'image/png'});
    await navigator.share({files:[file],text:brag()});
    m.textContent='';
  }catch(e){
    if(e&&e.name==='AbortError') return;
    m.textContent='공유창이 안 열려요. 이미지를 저장한 뒤 인스타에 올려주세요';
  }
});
$('saveBtn').addEventListener('click',async()=>{
  sfx.click(); if(!lastCard) return;
  const m=$('copyMsg');
  if(IN_CLAUDE){
    if(!dl){ m.textContent='카드 이미지를 길게 눌러 저장해 주세요'; return; }
    try{ await dl.save({filename:cardName(),data:await cardBlob()}); m.textContent='저장했어요!'; }
    catch(e){ const c=e&&e.code; m.textContent=c==='declined'?'저장을 취소했어요':c==='rate_limited'?'잠시 후 다시 눌러주세요':'카드 이미지를 길게 눌러 저장해 주세요'; }
    return;
  }
  // 일반 웹사이트: 휴대폰은 공유창의 '이미지 저장', 컴퓨터는 바로 다운로드
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile&&canShareFiles()){
    try{ await navigator.share({files:[new File([await cardBlob()],cardName(),{type:'image/png'})]}); return; }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }
  try{
    const url=URL.createObjectURL(await cardBlob()), a=document.createElement('a');
    a.href=url; a.download=cardName(); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    m.textContent=mobile?'저장이 안 됐다면 카드 이미지를 길게 눌러 저장해 주세요':'저장했어요!';
  }catch(e){ m.textContent='카드 이미지를 길게 눌러 저장해 주세요'; }
});
$('todayInfo').innerHTML=`<b style="color:#2b5d8a;font-weight:normal">오늘의 바람 · ${MON}월 ${DAY}일</b><br>오늘 하는 사람은 모두 같은 바람에서 겨뤄요<br>내 최고 ${load(KEY_BEST)}cm · 오늘 최고 ${load(KEY_DAY)}cm`;

/* ---------- 루프 ---------- */
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize); resize();

function step(dt){
  wind+=(windTarget-wind)*Math.min(1,dt*1.2);
  const alive=state==='aim'||state==='hold'||state==='drop'||state==='settle';
  danger=0;
  if(alive){
    const st=stability(), top=topBall(), H=top.y+top.r;
    const target=wind*0.006*H+st.mean*0.1;
    thetaV+=(-14*(theta-target)-2.4*thetaV)*dt; theta+=thetaV*dt;
    const st2=stability(); danger=st2.danger;
    if(state==='settle') peakDanger=Math.max(peakDanger,danger);
    creakCd-=dt; if(danger>0.8&&prevDanger<=0.8&&creakCd<=0){ sfx.creak(); creakCd=1.2; } prevDanger=danger;
    if(danger>1) collapse(st2.k,st2.sign);
  }
  pivot.rotation.z=-theta*0.35;

  // 착지 찌그러짐
  tower.forEach(b=>{
    if(b.squish>0){ b.squish=Math.max(0,b.squish-dt*5); const s=Math.sin(b.squish*Math.PI)*b.squish;
      b.mesh.scale.set(b.r*(1+0.12*s),b.r*(1-0.16*s),b.r*(1+0.12*s)); }
  });

  const swinging=state==='title'||state==='aim'||state==='hold';
  if(tower.length && (swinging||state==='drop') && cur){
    const tw=topWorld(), top=topBall();
    const cloudY=tw.y+top.r+3.6;
    if(swinging){
      swingCenter+=(tw.x-swingCenter)*Math.min(1,dt*2);
      swingPhase+=Math.min(3.4,1.5+levels*0.09)*dt;
      cur.x=swingCenter+SWING_A*Math.sin(swingPhase);
      if(state==='hold'){ cur.r=Math.min(MAX_R,cur.r+GROW*dt); cur.mesh.rotation.z-=dt*2.5; growUpdate(cur.r); if(cur.r>=MAX_R&&!cur.full){ cur.full=true; sfx.full(); } }
      cur.y=cloudY-0.45-cur.r;
      cloud.position.set(cur.x,cloudY+0.3,0);
    }else{
      cur.vy-=26*dt; cur.y+=cur.vy*dt;
      const landY=tw.y+(top.r+cur.r)*0.88;
      if(cur.y<=landY){ cur.y=landY; land(landY); }
    }
    if(cur){
      cur.mesh.position.set(cur.x,cur.y,0); cur.mesh.scale.setScalar(cur.r);
      const gTop=cur.y-cur.r, gBot=tw.y+top.r;
      guide.visible=swinging&&gTop>gBot; guide.position.set(cur.x,(gTop+gBot)/2,0); guide.scale.y=Math.max(0.01,gTop-gBot);
    }else guide.visible=false;
    cloud.visible=true;
  }else{ guide.visible=false; }
  if(state==='settle'){ settleT+=dt; if(settleT>0.45) commit(); }
  if(state==='collapse'||state==='miss'){ overT-=dt; if(overT<=0) gameOver(); }

  // 떨어지는 눈덩이
  fallers.forEach(f=>{
    const m=f.mesh; f.vy-=22*dt;
    m.position.x+=f.vx*dt; m.position.y+=f.vy*dt; m.position.z+=f.vz*dt;
    m.rotation.z-=f.vx*dt/f.r; m.rotation.x+=f.vz*dt/f.r;
    if(m.position.y<f.r){ m.position.y=f.r; f.vy=Math.abs(f.vy)>1.5?-f.vy*0.3:0; f.vx*=0.82; f.vz*=0.82; }
    if(m.position.y<=f.r+0.001){ f.vx*=Math.max(0,1-dt*1.8); f.vz*=Math.max(0,1-dt*1.8); }
  });

  // 카메라
  if(tower.length && alive){ focusY+=((topWorld().y+1.4)-focusY)*Math.min(1,dt*2.5); }
  else if(state==='title'){ focusY+=(3.2-focusY)*Math.min(1,dt*2); }
  camX+=(swingCenter*0.8-camX)*Math.min(1,dt*2);
  const tanH=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const dist=Math.max(11,3.3/(tanH*camera.aspect));
  let sx=0,sy=0;
  if(danger>0.82){ const k=(danger-0.82)/0.18*0.06; sx=(Math.random()-0.5)*k; sy=(Math.random()-0.5)*k; }
  camera.position.set(camX+sx,focusY+2.4+sy,dist);
  camera.lookAt(camX,focusY,0);
  sun.position.set(camX+6,focusY+12,9); sun.target.position.set(camX,focusY-4,0);

  // 내리는 눈
  const pa=snowPts.geometry.attributes.position, arr=pa.array, spd=snowPts.userData.spd;
  for(let i=0;i<SNOW_N;i++){
    arr[i*3+1]-=spd[i]*dt; arr[i*3]+=(wind*1.2+Math.sin(performance.now()/900+i)*0.2)*dt;
    if(arr[i*3+1]<focusY-9){ arr[i*3+1]=focusY+13; arr[i*3]=camX+(Math.random()-0.5)*26; }
    if(arr[i*3]>camX+13) arr[i*3]-=26; else if(arr[i*3]<camX-13) arr[i*3]+=26;
  }
  pa.needsUpdate=true;

  $('vig').style.opacity=alive?Math.max(0,Math.min(1,(danger-0.6)/0.4)).toFixed(2):'0';
  updateWindHUD();
  if(windGain&&ac){ const v=state==='title'?0.03:Math.min(0.45,Math.abs(wind)*0.22+0.03); if(Math.abs(v-lastWG)>0.01){ lastWG=v; windGain.gain.setTargetAtTime(v,ac.currentTime,0.4); } }
}

let last=performance.now();
function loop(t){
  const dt=Math.min(0.033,Math.max(0,(t-last)/1000)); last=t;
  step(dt); renderer.render(scene,camera); requestAnimationFrame(loop);
}
reset(); state='title'; updateHUD();
requestAnimationFrame(loop);
})();
</script>
</body>
